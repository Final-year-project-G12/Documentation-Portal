name: Build PCM Documentation Portal

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check for test files
      id: test-check
      run: |
        if [ -d "src/__tests__" ] || [ -d "src/*.test.js" ] || [ -d "src/*.test.jsx" ] || [ -d "src/*.test.ts" ] || [ -d "src/*.test.tsx" ]; then
          echo "has-tests=true" >> $GITHUB_OUTPUT
        else
          echo "has-tests=false" >> $GITHUB_OUTPUT
        fi
      shell: bash
    
    - name: Run tests
      if: steps.test-check.outputs.has-tests == 'true'
      run: npm test -- --watchAll=false --coverage=false
      env:
        CI: false
    
    - name: Build
      run: npm run build
      env:
        CI: false
        GENERATE_SOURCEMAP: false
    
    - name: Upload build artifacts
      if: success() && matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: build/
        retention-days: 7